name: Build 042 date type fix

on:
  push:
    branches:
      - build/042-curated-cover

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/042-curated-cover
      - name: Apply exact type-safe date formatting fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.svelte')
          s = p.read_text()
          old = ".filter(Boolean).map((date) => date.split('-').reverse().join('.')).join(' – ')"
          new = ".filter((date): date is string => Boolean(date)).map((date) => date.split('-').reverse().join('.')).join(' – ')"
          if old not in s:
              raise SystemExit('expected exact Build 042 date expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit exact fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.svelte
          git commit -m "fix: make cover date formatting type-safe"
          git push origin HEAD:build/042-curated-cover
