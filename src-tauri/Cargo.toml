[package]
name = "northern-lines-studio"
version = "0.32.0-alpha.1"
description = "Northern Lines Studio – Travel Publishing workspace"
authors = ["Northern Lines"]
edition = "2021"

[lib]
name = "northern_lines_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
