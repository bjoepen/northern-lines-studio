[package]
name = "northern-lines-studio"
version = "0.40.0-alpha.1"
description = "Northern Lines Studio – Travel Publishing workspace"
authors = ["Northern Lines"]
edition = "2021"

[lib]
name = "northern_lines_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lopdf = { version = "0.44.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSGraphics"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["WKPDFConfiguration", "WKWebView", "block2", "objc2-core-foundation", "WKWebViewConfiguration", "WKPreferences"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"

[dev-dependencies]
tempfile = "3"
